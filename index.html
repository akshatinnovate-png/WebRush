<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#120C18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4EFE3" media="(prefers-color-scheme: light)" />
    <title>Carbon Copy — a decade of receipts, reassembled</title>
    <meta
      name="description"
      content="153,597 receipts from one person's digital life between 2013 and 2024 — every song, every rupee, every swipe — rebuilt into a single story. Half of the last two years belongs to someone else."
    />
    <meta name="author" content="Akshat Sarkar" />
    <link rel="canonical" href="/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carbon Copy" />
    <meta property="og:title" content="Carbon Copy — a decade of receipts, reassembled" />
    <meta
      property="og:description"
      content="Music, a household ledger and a card trail, woven into one life. Then the part of it that was never theirs."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      Fonts come from this origin, so there are no third-party DNS or TLS round
      trips in the critical path and the CSP can drop two external hosts.
      Preloaded because the first paint uses them immediately.
    -->
    <link rel="preload" as="font" type="font/woff2"
      href="/fonts/jetbrains-mono-variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2"
      href="/fonts/instrument-serif-normal-400.woff2" crossorigin />
    <link rel="preload" as="fetch" href="/data/core.json" fetchpriority="high" crossorigin />
    <link rel="prefetch" as="fetch" href="/data/graph.json" crossorigin />
    <style>
      /* Painted before any JavaScript runs, so the first frame is never blank. */
      :root {
        --boot-bg: #120c18;
        --boot-fg: #6b5f7d;
        --boot-accent: #ff5c8a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --boot-bg: #f4efe3;
          --boot-fg: #6d6255;
          --boot-accent: #c81f56;
        }
      }
      html {
        background: var(--boot-bg);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.9rem;
        justify-items: center;
        font: 300 0.75rem/1.6 ui-monospace, "JetBrains Mono", monospace;
        letter-spacing: 0.22em;
        color: var(--boot-fg);
        background: var(--boot-bg);
      }
      #boot b {
        display: block;
        width: 3.5rem;
        height: 1px;
        background: var(--boot-accent);
        transform-origin: left;
        animation: bootline 1.1s ease-in-out infinite;
      }
      @keyframes bootline {
        0%,
        100% {
          transform: scaleX(0.15);
          opacity: 0.4;
        }
        50% {
          transform: scaleX(1);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot b {
          animation: none;
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <b></b>
      reading the record
    </div>
    <noscript>
      <p
        style="
          font: 400 1rem/1.7 ui-monospace, monospace;
          color: #e9e0f2;
          max-width: 34rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
        "
      >
        Carbon Copy reassembles 153,597 receipts from one person's digital life
        between 2013 and 2024. It needs JavaScript to draw them. The underlying
        data — 149,860 music plays, 2,461 household ledger entries and 8,725 card
        transactions — is published as JSON under
        <code>/data/</code> if you would rather read it directly.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
